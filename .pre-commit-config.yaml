
repos:
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: '^(internal/provider/.*\.md)|docs/.*|\.rst|\.go|\.md\.tmpl$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(internal/provider/.*\.md)|docs/.*$'
      - id: end-of-file-fixer
        exclude: '.*\.md$'
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.1
    hooks:
      - id: golangci-lint-full

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'output=$(go fmt ./...); if [ -n "$output" ]; then echo "Files not formatted:"; echo "$output"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./... || exit 0'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test -short ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: tfplugindocs
        name: terraform-plugin-docs generate
        entry: bash -c 'tfplugindocs generate --provider-name idgen'
        language: system
        pass_filenames: false
        files: '(internal/provider/.*\.go|examples/.*|templates/.*)'

      - id: search-and-replace
        language: system
        name: search and replace
        entry: bash -c 'for x in "$@"; do echo "Processing $x"; sed -i -E "/^(\S{5})|(#.*)$/!d"  "$x"; done' --
        files: internal/data/.*words.txt$
        pass_filenames: true
        stages: [manual]

      - id: changelog
        name: Update changelog
        entry: git-cliff -o CHANGELOG.md
        language: system
        pass_filenames: false
        stages: [manual]
